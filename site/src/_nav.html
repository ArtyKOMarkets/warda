    <button class="nv-burger" id="nv-burger" aria-expanded="false" aria-controls="nv-links" aria-label="Menu">

<script>
/* The menu, on every page. A link that scrolls or navigates also closes it —
   leaving the panel covering the thing you just asked to see is the classic
   mobile-nav bug. */
(function () {
  var b = document.getElementById("nv-burger");
  var l = document.getElementById("nv-links");
  if (!b || !l) return;
  b.addEventListener("click", function () {
    var open = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", String(open));
    l.setAttribute("data-open", open ? "1" : "");
  });
  Array.prototype.forEach.call(l.querySelectorAll("a"), function (a) {
    a.addEventListener("click", function () {
      b.setAttribute("aria-expanded", "false");
      l.setAttribute("data-open", "");
    });
  });
})();
</script>
