  <!-- Drawn from the same JSON the cards below are drawn from. A diagram is
       the easiest thing on a site like this to let drift: it is made once, in
       a drawing program, and then the agents change and the picture does not.
       This one has no positions for an agent it cannot read. -->
  <figure class="graph" id="g-graph" hidden>
    <!-- 700 tall, and it has been 440 and 560 on the way here. Each time the
         height was right for the agents that existed when it was typed, and
         each time a new row was added without it: a node drawn below the
         viewBox is not clipped with an error, it is simply not on the picture.
         A viewBox is as easy to leave behind as a sentence. -->
    <svg viewBox="0 0 760 700" role="img" aria-labelledby="g-graph-t">
      <!-- No count in here. It said "Four agents" and was wrong the day a
           fifth arrived — in the accessible name, which is the one version of
           this picture a screen reader gets. -->
      <title id="g-graph-t">The agents: who replaced whom, who delegated whom, and who paid whom</title>
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--teal)"></path>
        </marker>
        <marker id="ar-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--chrome-faint)"></path>
        </marker>
        <marker id="ar-unrec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--amber)"></path>
        </marker>
      </defs>
      <g id="g-edges"></g>
      <g id="g-nodes"></g>
    </svg>
    <figcaption>
      <span class="hint">Scroll the diagram sideways to reach the sellers. </span>
      Solid arrows are payments that settled, with the amount this grant has spent on that payee.
      Dotted arrows are authority: <span class="lg-auth">who replaced whom, and who delegated whom</span>.
      A dimmed agent&rsquo;s grant no longer exists.
      <span class="lg-unrec">An amber arrow ending in nothing is money the covenant says left that
      grant, with no surviving receipt naming who received it</span> &mdash; the chain settles
      whether a coin moved, and only a receipt settles to whom.
    </figcaption>
  </figure>
