<!-- The grant, in the shape a developer already recognises.
     Filled by _wallet.js from the same agent-00N.json as the rest of the page;
     nothing here is written by hand and nothing is a claim the chain has not
     been asked about. -->
<section class="wal" id="w-panel" hidden>
  <div class="wal-top">
    <div>
      <p class="wal-id" id="w-id">—</p>
      <p class="wal-addr" id="w-addr">—</p>
    </div>
    <div class="wal-bal">
      <p class="wal-amt" id="w-bal">—</p>
      <p class="wal-sub" id="w-balsub">—</p>
    </div>
  </div>

  <p class="wal-head">Authority</p>
  <ul class="wal-rules" id="w-rules"></ul>

  <div class="wal-acthead">
    <p class="wal-head">Activity</p>
    <p class="wal-count" id="w-count">—</p>
  </div>
  <ul class="wal-act" id="w-act"></ul>

  <p class="wal-foot">
    These are not settings. They are in the script that unlocks the coin, and the
    network checks them on every spend &mdash; including the one that is crossed out.
  </p>
</section>
