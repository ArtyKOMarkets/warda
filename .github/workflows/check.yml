# Run the evidence, so it cannot decay quietly.
#
# This file exists because of a specific failure, and the failure is the
# argument for every choice in it.
#
# `covenant/harness` proves the covenant at the bytecode level: it runs the
# compiled script through TxScriptEngine, the engine a Kaspa node validates
# with. On 15 September 2026 it was discovered to have been broken for two
# covenant versions. v4 had inserted three constructor parameters and appended
# a fourth; the suite still passed the v2 list. Nobody noticed, because nobody
# ran it — and `LIMITS.md`, `GUARANTEES.md` and the site's evidence page all
# quoted figures it had produced when it last worked.
#
# The worst of the five defects was SILENT. The successor's accounting was
# written into slots v4 had repurposed, so successors compiled fine at a wrong
# geometry, their addresses never matched the continuation the covenant derives,
# and everything was refused. The three BASELINES failed and every "rejected"
# test passed — for reasons unrelated to the rule each was testing. A suite
# reporting 18 of 33 green looked healthy to anyone who did not read which 18.
#
# So the rule this repo already had — prove the bytecode, not the semantics —
# needed a second half: a proof that is not re-run is not a proof. This is that
# half.

name: check

on:
  push:
    branches: [main]
  pull_request:
  # The decay took two covenant versions and nobody was pushing to the covenant
  # in between. A weekly run catches rot in the things AROUND it too — a pinned
  # dependency yanked, a toolchain moving under us.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # The covenant. This job is the reason the file exists; it runs first in
  # spirit, and is deliberately NOT allowed to be skipped by path filters.
  # The suite decayed because a change somewhere else moved something under it,
  # which is exactly the case a path filter would have excluded.
  # ---------------------------------------------------------------------------
  covenant:
    name: covenant — bytecode, in the node's own engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Both suites compile rusty-kaspa and silverscript from pinned revisions.
      # Cold that is minutes; cached it is seconds. Keyed on the lockfiles, so a
      # deliberate bump invalidates it and an accidental one cannot hide.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            covenant/harness/target
            covenant/deploy/target
          key: cargo-${{ runner.os }}-${{ hashFiles('covenant/*/Cargo.toml', 'covenant/*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # 33 tests: one accepted baseline per entrypoint, then single-field flips
      # from it. The baselines are the load-bearing part — a refusal only means
      # something when the transaction it was flipped from is accepted — so a
      # failure here is never "most of them passed".
      - name: harness — flip tests against TxScriptEngine
        working-directory: covenant/harness
        run: cargo test --test spend -- --nocapture

      # C1's suite, against covenant/warda_grant_v5.sil — v4 plus delegate2,
      # which is not deployed and which no grant runs. It is in CI anyway: an
      # unreleased covenant with a passing suite is a covenant somebody can
      # finish, and one with a suite nobody runs rots into a file that looks
      # like work. Exits non-zero the moment a flip is accepted.
      - name: harness — C1, conservation across two children
        working-directory: covenant/harness
        run: cargo run --release --bin c1

      # The same engine, asked a different question: every claim in
      # GUARANTEES.md at its BOUNDARY, one sompi either side. A flip test
      # proves a rule is present; only a boundary pair proves it is in the
      # right place, and an off-by-one on a spending cap is a defect with
      # money behind it. Exits non-zero the moment the engine accepts
      # something the published guarantees forbid.
      - name: harness — auditor, every guarantee at its boundary
        working-directory: covenant/harness
        run: cargo run -q --bin audit

      # The pass that needs no builder, run against this repo's own covenant.
      # It is the tier a stranger can use, so a change that breaks it breaks
      # the only thing here anybody else can run.
      - name: harness — scan, the pass that needs no builder
        working-directory: covenant/harness
        run: cargo run -q --bin scan -- ../warda_grant.sil

      # The oracle that reads no specification: generate spend attempts
      # structurally, keep what the engine accepted, and assert that none of
      # them left the agent able to do more than before. The run ends by
      # deleting the epoch ratchet — vulnerability 1 put back — and requires
      # the same oracle to catch it. Exits 2 if it does not, because an oracle
      # that cannot fire makes every clean run above meaningless.
      - name: harness — authority never grows, and the oracle proves it can fire
        working-directory: covenant/harness
        run: cargo run -q --bin fuzz

      # The same oracle, pointed at DELEGATION — where "authority" stops being
      # a number on one grant and becomes a property of a tree. A delegation
      # pays nobody, so the parent and its child together must not be able to
      # do anything the parent could do alone: not more money, and not a bigger
      # single payment, a longer life, an earlier start or a deeper subtree.
      # Three holes are put back, one per axis, and all three must be caught —
      # one mutant only proves the oracle can see one thing.
      - name: harness — a delegation never creates authority
        working-directory: covenant/harness
        run: cargo run -q --bin fuzz-delegate

      # And settlement, where a grant DISAPPEARS: afterwards the parent alone
      # must not be able to do anything it and its child could do together.
      # Two of the four holes here are the money — the charge and the release,
      # which fail in opposite directions — and two are limits the parent is
      # supposed to carry across unchanged, which no conservation rule covers.
      - name: harness — a settlement never creates authority
        working-directory: covenant/harness
        run: cargo run -q --bin fuzz-settle

      # And the exits, where the question inverts. An exit ends the grant, so
      # "authority never grows" is satisfied by construction and would pass
      # against a covenant with no rules at all. The danger here is the
      # opposite — somebody DESTROYING value on the way out — so the property
      # is differential: whoever may end a grant must not thereby choose what
      # it is worth. Four holes, one per axis: where the coin goes, how much
      # arrives, who may end it, and when.
      - name: harness — an exit's signer never chooses the outcome
        working-directory: covenant/harness
        run: cargo run -q --bin fuzz-exit

      # 14 probes, each attack beside its nearest legitimate twin, judged in
      # BOTH directions: a covenant that refused everything would pass a suite
      # made only of refusals. Needs no keys and no network — the corpus is
      # sdk/probes/, committed.
      - name: deploy — adversarial probes, accepts and refusals
        working-directory: covenant/deploy
        run: cargo run -q -- probe

  # ---------------------------------------------------------------------------
  # The packages.
  # ---------------------------------------------------------------------------
  packages:
    name: packages — rules, builders, clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Before the tests, and this ordering is not cosmetic. Package tests
      # import `src/`; the repo's tools import the package, which resolves to
      # `dist/`. A stale build is green and wrong at the same time — it has
      # already cost one unrecoverable payment. `check-dist` refuses to let the
      # suite run against one, so the build has to come first.
      - name: Build every workspace, so nothing is tested against a stale dist
        run: npm run build --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck

      # Per workspace rather than one `--workspaces` run: a single combined
      # failure line tells you a number, and these packages fail for unrelated
      # reasons. Named steps say WHICH half of the protocol broke.
      - name: core — the rules, computed once
        run: npm test
      - name: sdk
        run: npm test --workspace sdk
      - name: x402 — the buyer's half
        run: npm test --workspace x402
      - name: provider — the seller's half of the guarantee
        run: npm test --workspace provider
      - name: vendor — the seller's half
        run: npm test --workspace vendor
      - name: borsh — the transport
        run: npm test --workspace borsh
      - name: verify
        run: npm test --workspace verify
      - name: wallet — the agent's half
        run: npm test --workspace wallet
      - name: registry
        run: npm test --workspace registry
      # The funding edges: the quote, the route's zones, and when a grant needs
      # its successor. Added late, and it had been missing since the package was
      # written — 85 tests that ran only when somebody remembered to run them,
      # which is the same shape as the covenant harness decaying for two
      # versions because nobody ran it either.
      - name: router — the funding edges
        run: npm test --workspace router
      - name: mcp
        run: npm test --workspace mcp
      - name: growth
        run: npm test --workspace growth
      - name: extension
        run: npm test --workspace extension
      - name: runner
        run: npm test --workspace runner

      # Not a workspace — the auditor service is three files beside the
      # covenant it analyses, and it depends on the vendor package rather than
      # being one. Its store is the only thing between one payment and
      # unlimited reports, so the tests run here where node already is,
      # rather than in a place somebody has to remember.
      - name: auditor service — one payment, one report, across a restart
        run: npm test --prefix covenant/auditor-service

      # The Listener's numbers live in shape.ts, in a table in its runbook and
      # — once it exists — in a grant whose terms cannot be edited. None of
      # the ways they drift produce an error: the buyer asks for more results
      # than the seller serves, or the software budget outruns the epoch
      # limit and the covenant refuses a pass at eight in the morning.
      - name: listener — the numbers still agree with each other
        run: node ops/check-listener.mjs

      # A grant's manifest already names the template it runs; covenant/versions.json
      # turns that fingerprint into a version the console and the site can show.
      # A map like that is worth nothing asserted, so every entry is re-derived
      # from its archived template here, GUARANTEES.md's table is compared
      # against it, and a manifest naming a template nobody has accounted for
      # fails rather than rendering as a guess.
      - name: covenant versions — every fingerprint re-derives
        run: node ops/check-versions.mjs

      # MAINNET.md is the list of what stands between this and real money, and
      # it is made entirely of citations into this repo. Citations rot: a file
      # gets edited, every line below shifts, and a blocker quietly points at a
      # blank line. Nobody notices, because nobody clicks a line number in a
      # markdown file until they are already looking for something. So the
      # quotes are checked against their sources here, and a drifted reference
      # fails with the line it drifted to.
      - name: MAINNET.md — every citation still says what it is quoted as saying
        run: node ops/check-mainnet-refs.mjs

      # The site is built here and thrown away. Nothing is deployed from CI —
      # the point is that `build.py` DROPS a page whose data is missing, and
      # everything linking to that page is published anyway, so the site can
      # ship looking finished with a 404 behind one link. That has happened
      # twice. Building on a fresh checkout also catches a page that stops
      # rendering because a placeholder was renamed, which no test would see.
      - name: site — it builds, and links nowhere empty
        run: |
          node ops/check-core-browser.mjs
          node ops/build-registry-sources.mjs --check
          node growth/deploy/sync.mjs --check
          node ops/check-deploys.mjs
          node ops/check-releasable.mjs
          node ops/check-audit.mjs
          python3 site/build.py
          node ops/check-links.mjs
          node ops/check-sitemap.mjs
          node ops/check-nav-tokens.mjs
          node ops/check-fonts.mjs
          node ops/check-commands.mjs
          node ops/check-portable.mjs
          node ops/check-router.mjs
          node ops/check-key-writes.mjs
          node ops/check-cli-tools.mjs
          node ops/check-cli-deps.mjs
          node ops/check-alerts.mjs
          node ops/check-readings.mjs
          node ops/check-runner.mjs

      # ops/ was typechecked by nothing and its one test file was run by
      # nothing. Both were true for as long as ops/ has existed, and neither
      # is the kind of gap a failing build announces — an unchecked tool is
      # green right up until the night it runs. The proxy test in particular
      # asserts which wRPC calls must NOT reach the node, which is the only
      # thing standing between a public endpoint and Shutdown.
      - name: ops — the tools that run on a schedule
        run: |
          npx tsc --noEmit -p ops/tsconfig.json
          node --experimental-strip-types --test ops/test/*.test.ts

      # `agents/` was unchecked too, and it held a live bug: dashboard.ts read
      # the node's DAA score sixty lines BELOW the empty-address message that
      # quotes it, so reaching that branch threw a ReferenceError instead of
      # printing the explanation. The one message written for the most
      # confusing failure in the tool was the one that could not be printed.
      - name: agents — the tools that write the published readings
        run: |
          npx tsc --noEmit -p agents/tsconfig.json
          npx tsc --noEmit -p agent/tsconfig.json
